<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14204A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Al Día">
<meta name="author" content="Biz Ascend Web Creators">
<meta name="description" content="Organiza tus gastos, pagos y deudas, sube tu crédito y haz crecer tu dinero.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Al Día Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — sticky top bar with tabs (bottom bar on phones), one view at a time, summary first then detail. */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --surface-2:#EDEFF7; --fg:#14204A; --muted:#59628A; --line:#DCE0EE;
  --accent:#C2187A; --accent-ink:#FFFFFF; --accent-soft:#FBE2F0;
  --navy:#14204A; --navy-2:#1E2D63; --navy-ink:#FFFFFF; --mustard:#D9A21B; --mustard-ink:#2A1F00; --mustard-soft:#FBF0D0;
  --good:#17865A; --good-soft:#DCF2E7; --warn:#A87708; --warn-soft:#FBF0D0; --bad:#D2391F; --bad-soft:#FBE0DA;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,32,74,.06), 0 4px 16px rgba(20,32,74,.07);
  --c1:#C2187A; --c2:#1F3A8A; --c3:#D9A21B; --c4:#7B3FBF; --c5:#2E8BC0; --c6:#E07B39; --c7:#14957F; --c8:#6E7FB8; --c9:#8A8FA8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1130; --surface:#121B42; --surface-2:#1A2552; --fg:#F1F3FA; --muted:#9BA4C8; --line:#283466;
  --accent:#FF4FA8; --accent-ink:#2A0418; --accent-soft:#3E1438;
  --navy:#070C24; --navy-2:#121B42; --navy-ink:#FFFFFF; --mustard:#EDBB3A; --mustard-ink:#2A1F00; --mustard-soft:#3A2F0E;
  --good:#4CD08A; --good-soft:#123A2A; --warn:#EDBB3A; --warn-soft:#3A2F0E; --bad:#FF7A5C; --bad-soft:#40181A;
  --c1:#FF4FA8; --c2:#6F8DF0; --c3:#EDBB3A; --c4:#B48CF0; --c5:#5BB8E8; --c6:#F29A5E; --c7:#3FC9AE; --c8:#A3B0E0; --c9:#9AA0BA;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1130; --surface:#121B42; --surface-2:#1A2552; --fg:#F1F3FA; --muted:#9BA4C8; --line:#283466;
  --accent:#FF4FA8; --accent-ink:#2A0418; --accent-soft:#3E1438;
  --navy:#070C24; --navy-2:#121B42; --navy-ink:#FFFFFF; --mustard:#EDBB3A; --mustard-ink:#2A1F00; --mustard-soft:#3A2F0E;
  --good:#4CD08A; --good-soft:#123A2A; --warn:#EDBB3A; --warn-soft:#3A2F0E; --bad:#FF7A5C; --bad-soft:#40181A;
  --c1:#FF4FA8; --c2:#6F8DF0; --c3:#EDBB3A; --c4:#B48CF0; --c5:#5BB8E8; --c6:#F29A5E; --c7:#3FC9AE; --c8:#A3B0E0; --c9:#9AA0BA;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:var(--navy-ink);border-bottom:3px solid var(--mustard)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.25rem}
/* historial */
.table-wrap{overflow-x:auto;margin-top:14px}
table.hist{width:100%;border-collapse:collapse;font-size:.88rem;min-width:720px}
.hist th,.hist td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hist th:first-child{text-align:left}
.hist thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.hist tbody th{font-weight:600}
.hist tr.cur{background:var(--accent-soft)}
.dl{font-size:.72rem;font-weight:600;margin-left:4px}
.dl.up{color:var(--good)} .dl.down{color:var(--bad)}
/* reporte: papel blanco siempre, en pantalla y en papel */
.rep{font-family:var(--f-body);font-size:11pt;color:#14204A}
.rep-head{display:flex;align-items:center;gap:12px;border-bottom:3px solid #D9A21B;padding-bottom:10px;margin-bottom:14px}
.rep-head .logo{width:44px;height:44px}
.rep-head h1{font-size:18pt;margin:0}
.rep-head p{margin:0;color:#C2187A;font-weight:700}
.rep-date{margin-left:auto!important;color:#59628A!important;font-weight:400!important;font-size:9pt}
.rep h2{font-size:12pt;margin:16px 0 6px;color:#14204A;border-left:4px solid #C2187A;padding-left:8px}
.rep-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rep-kpis div{border:1px solid #DCE0EE;border-radius:8px;padding:8px}
.rep-kpis span{display:block;font-size:8.5pt;color:#59628A}
.rep-kpis b{font-family:var(--f-num);font-size:13pt}
.rep table{width:100%;border-collapse:collapse;font-size:9.5pt}
.rep th,.rep td{padding:4px 6px;border-bottom:1px solid #DCE0EE;text-align:left}
.rep th{font-size:8pt;text-transform:uppercase;color:#59628A}
.rep td:not(:first-child),.rep th.r{text-align:right;font-variant-numeric:tabular-nums}
.rep tr.grp td{background:#EDEFF7}
.rep tr.tot td{background:#FBE2F0;font-weight:700}
.rep tr{break-inside:avoid}
.rep-foot{margin-top:18px;border-top:1px solid #DCE0EE;padding-top:8px;font-size:8.5pt;color:#59628A}
.rep-foot p{margin:2px 0}
#repview{position:fixed;inset:0;z-index:60;background:rgba(8,18,14,.6);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px))}
.repbar{position:sticky;top:0;z-index:1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;max-width:820px;margin:0 auto 10px}
.repbar .btn{box-shadow:var(--shadow)}
.paper{background:#fff;color:#14204A;max-width:820px;margin:0 auto;border-radius:14px;padding:22px;overflow-x:auto}
.paper .rep-head .logo{width:44px;height:44px}
.rep-note{max-width:820px;margin:10px auto 0;color:#fff;font-size:.85rem;text-align:center}

#print{display:none}
@media print{
  @page{margin:14mm}
  :root{padding:0!important}
  body{background:#fff!important;color:#14204A!important}
  body > *:not(#print){display:none!important}
  .rep-head .logo{width:44px;height:44px}
  #print{display:block}
}
/* bienvenida */
.welcome{display:grid;gap:14px;padding:20px;border-radius:var(--r);background:var(--surface);border:2px solid var(--mustard);box-shadow:var(--shadow)}
.steps3{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));counter-reset:st}
.steps3 li{counter-increment:st}
.steps3 button{width:100%;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.steps3 button::before{content:counter(st);grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-num);font-weight:600}
.steps3 button:hover{border-color:var(--accent)}
.steps3 span{font-size:.82rem;color:var(--muted)}
.welcome > .btn{justify-self:start}
/* PIN */
.lockbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:7px 12px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;cursor:pointer}
.lockbtn:hover{background:rgba(255,255,255,.2)}
#lock{position:fixed;inset:0;z-index:100;background:var(--navy);color:#fff;display:grid;place-items:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--mustard)}
.lock-box{width:min(340px,100%);display:grid;justify-items:center;gap:10px;text-align:center}
.lock-box .logo{width:64px;height:64px;margin-bottom:6px}
.lock-box h2{color:#fff;font-size:1.5rem}
.lock-sub{color:rgba(255,255,255,.78);max-width:34ch}
.pin-dots{display:flex;gap:16px;margin:12px 0 4px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mustard);transition:background .15s}
.pin-dots i.on{background:var(--mustard)}
.pin-err{color:#FFB4D6;font-weight:600;min-height:1.2em}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:8px}
.keypad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-family:var(--f-num);font-size:1.6rem;cursor:pointer;transition:background .12s}
.keypad button:hover{background:rgba(255,255,255,.18)}
.keypad button:active{background:var(--accent)}
.keypad button:disabled{opacity:.35;cursor:not-allowed}
.keypad .kp-txt{background:none;font-family:var(--f-body);font-size:.9rem;font-weight:600}
.keypad .kp-txt[data-pin-act="del"]{font-size:1.4rem}
.linkbtn{background:none;border:0;color:var(--mustard);font-weight:600;cursor:pointer;text-decoration:underline;margin-top:10px}
.lock-actions{display:grid;gap:10px;width:100%;margin-top:10px}
.lock-actions .btn{padding:12px;border-radius:12px}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.lock-sign{margin-top:18px;font-size:.78rem;color:rgba(255,255,255,.5)}
.banner.nudge{border-color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){.pin-dots.shake{animation:shake .35s}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (max-width:720px){.lockbtn{padding:7px 10px}}
.sign{display:grid;justify-items:center;gap:2px;text-align:center;color:var(--muted);font-size:.85rem;padding-top:12px}
.sign-line{width:48px;height:3px;border-radius:3px;background:var(--mustard);margin-bottom:10px}
.sign strong{color:var(--accent);font-family:var(--f-display);font-weight:700;letter-spacing:.01em}
.brand .logo{width:34px;height:34px;flex:0 0 auto;display:block}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--mustard);color:var(--mustard-ink);display:grid;place-items:center;font-size:.9rem}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;color:rgba(255,255,255,.72);font-weight:600;cursor:pointer}
.tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.tab:focus-visible{outline-color:var(--mustard)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mustard);margin-left:6px;vertical-align:middle}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 96px;display:grid;gap:20px}
.view{display:grid;gap:20px}
.view-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.view-head p{max-width:62ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}

.stat .big{font-family:var(--f-num);font-size:1.7rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .sub{font-size:.85rem;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}

/* lists */
.rows{display:grid}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .meta{font-size:.82rem;color:var(--muted)}
.row .right{text-align:right;display:grid;justify-items:end;gap:3px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar > i.warn{background:var(--warn)} .bar > i.bad{background:var(--bad)} .bar > i.good{background:var(--good)}

/* alerts */
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.alert .stripe{align-self:stretch;border-radius:4px;background:var(--muted)}
.alert.bad .stripe{background:var(--bad)} .alert.warn .stripe{background:var(--warn)} .alert.good .stripe{background:var(--good)}
.alert .t{font-weight:600}
.alerts{display:grid;gap:8px}

/* example banner */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border:1px dashed var(--warn);background:var(--warn-soft);border-radius:var(--r);color:var(--fg)}

/* calendar */
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:4px;min-width:330px}
.cal .dow{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.day{min-height:92px;background:var(--surface-2);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.out{background:transparent}
.day.today{outline:2px solid var(--mustard);outline-offset:-2px}
.day .d{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.chip{border:0;text-align:left;font-size:.72rem;line-height:1.25;padding:3px 5px;border-radius:5px;cursor:pointer;background:var(--surface);color:var(--fg);border-left:3px solid var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.paid{opacity:.55;text-decoration:line-through;border-left-color:var(--good)}
.chip.late{border-left-color:var(--bad);background:var(--bad-soft)}
.chip.soon{border-left-color:var(--warn)}
@media (max-width:600px){.day{min-height:64px;padding:4px}.chip{font-size:0;padding:0;height:7px;border-left-width:0;background:var(--accent)}.chip.late{background:var(--bad)}.chip.soon{background:var(--warn)}.chip.paid{background:var(--good)}}

/* forms */
.field{display:grid;gap:5px}
.field label,.field legend{font-size:.85rem;font-weight:600;color:var(--fg);padding:0}
fieldset.field{border:0;margin:0;padding:0;min-width:0}
.field legend{margin-bottom:8px}
.hint{font-size:.78rem;color:var(--muted)}
.full{grid-column:1/-1}
.field > input, .money-in input, .field select{width:100%;height:46px;padding:0 14px;border:1.5px solid transparent;border-radius:12px;background:var(--surface-2);color:var(--fg);transition:border-color .15s,box-shadow .15s,background .15s}
.field > input::placeholder, .money-in input::placeholder{color:var(--muted);opacity:.7}
.field > input:hover, .money-in input:hover{border-color:var(--line)}
.field > input:focus, .money-in input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-opt{position:relative;cursor:pointer}
.chip-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip-opt span{display:inline-block;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.88rem;font-weight:600;color:var(--muted);transition:all .15s}
.chip-opt:hover span{border-color:var(--muted);color:var(--fg)}
.chip-opt input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chip-opt input:focus-visible + span{box-shadow:0 0 0 4px var(--accent-soft);border-color:var(--accent)}
input[type=range]{height:6px;margin-block:12px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

dialog{border:0;border-radius:20px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}
dialog::backdrop{background:rgba(8,18,14,.5);backdrop-filter:blur(3px)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 22px 6px}
.dlg-head h3{font-size:1.3rem}
.dlg-body{padding:14px 22px 18px;overflow-y:auto;gap:16px}
.dlg-err{color:var(--bad);padding:0 22px 10px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--line);background:var(--surface)}
.dlg-foot .btn{padding:11px 18px;border-radius:12px}
.icon-btn{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);color:var(--fg);cursor:pointer;font-size:1.3rem;line-height:1}
.icon-btn:hover{background:var(--line)}
@media (max-width:600px){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92%}
  dialog form{max-height:92vh}
  .dlg-head::before{content:"";position:absolute;left:50%;top:8px;width:40px;height:4px;border-radius:4px;background:var(--line);transform:translateX(-50%)}
  .dlg-foot{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}

/* credit gauge */

/* mis gastos */

<script>
(() => {
"use strict";
const KEY = "aldia-v1";
const APP_VERSION = "6";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n, d=0) => (n<0?"-":"") + "$" + Math.abs(n).toLocaleString("es-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const uid = () => Math.random().toString(36).slice(2,9);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DOW = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const today = new Date(); today.setHours(0,0,0,0);
const ym = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
const DEBT_TYPES = {tarjeta:"Tarjeta de crédito", prestamo:"Préstamo personal", auto:"Préstamo de auto", estudiantil:"Préstamo estudiantil", medica:"Deuda médica", otra:"Otra"};
const BILL_CATS = ["Vivienda","Servicios","Transporte","Seguros","Teléfono e internet","Suscripciones","Otro"];

/* ---------- grupos de gastos: n = necesidad, w = gusto, s = ahorro ---------- */
const GROUPS = [
  {id:"hogar",name:"Hogar",tip:"Lo recomendado: que vivienda y servicios no pasen del 30% de tu ingreso.",items:[
    ["renta","Renta o hipoteca","n"],["luz","Luz (LUMA)","n"],["agua","Agua (AAA)","n"],["gas","Gas","n"],["internet","Internet y cable","n"],
    ["patio","Patio y jardín","w"],["mant_casa","Mantenimiento y reparaciones","n"],["seguro_casa","Seguro de la casa","n"],["limpieza","Artículos de limpieza","n"],["mantenimiento_cond","Cuota de mantenimiento (condominio)","n"]]},
  {id:"vehiculo",name:"Vehículo",tip:"Si el préstamo del carro ya está en tus deudas (pestaña Crédito), deja “Pago del vehículo” en 0 para no contarlo doble.",items:[
    ["pago_auto","Pago del vehículo","n"],["gasolina","Gasolina","n"],["seguro_auto","Seguro del vehículo","n"],["autoexpreso","AutoExpreso (peajes)","n"],
    ["marbete","Marbete (dividido entre 12)","n"],["mant_auto","Mantenimiento, aceite y gomas","n"],["estacionamiento","Estacionamiento","n"],["lavado","Lavado del carro","w"],["transporte","Uber o transporte público","n"]]},
  {id:"comida",name:"Comida",tip:"Cocinar en casa es de los ahorros más rápidos: cada salida a comer cuesta de 3 a 5 veces más.",items:[
    ["supermercado","Compra de comida del mes","n"],["restaurantes","Restaurantes","w"],["rapida","Comida rápida y delivery","w"],["almuerzos","Almuerzos del trabajo","w"],["cafe","Café y meriendas","w"]]},
  {id:"movil",name:"Móvil y suscripciones",tip:"Revisa tu estado de cuenta: muchas personas pagan suscripciones que ya no usan.",items:[
    ["movil","Plan del móvil","n"],["equipo","Pago del teléfono (equipo)","n"],["netflix","Netflix","w"],["musica","Música (Spotify, Apple Music)","w"],
    ["streaming","Otros streaming (Disney+, Max, Prime)","w"],["nube","Almacenamiento en la nube","w"],["apps","Apps y juegos","w"]]},
  {id:"compras",name:"Compras y ropa",tip:"Una regla útil: espera 48 horas antes de comprar algo que no planificaste.",items:[
    ["ropa","Ropa y zapatos","w"],["cuidado","Cuidado personal (pelo, uñas, barbería)","w"],["gimnasio","Gimnasio","w"],["online","Compras en línea (Amazon y otras)","w"],["tienda","Tiendas por departamento","w"],["regalos","Regalos y cumpleaños","w"]]},
  {id:"diversion",name:"Diversión",tip:"Ponle un tope a la diversión y disfrútala sin culpa. Si te pasas, recorta aquí primero.",items:[
    ["salidas","Salidas y fiestas","w"],["cine","Cine, conciertos y eventos","w"],["viajes","Viajes y playa","w"],["pasatiempos","Pasatiempos","w"],["loteria","Lotería y juegos","w"],["alcohol","Bebidas","w"]]},
  {id:"familia",name:"Familia y salud",tip:"El plan médico y las medicinas son necesidades: no los recortes para pagar deudas.",items:[
    ["plan_medico","Plan médico","n"],["medicinas","Medicinas y copagos","n"],["cuido","Cuido de niños","n"],["escuela","Escuela y materiales","n"],
    ["pension","Pensión alimentaria","n"],["mascotas","Mascotas","w"],["ayuda","Ayuda a familiares","w"]]},
  {id:"ahorro",name:"Deudas y ahorro",tip:"Meta: un fondo de emergencia de 3 a 6 meses de gastos. Empieza con $500.",items:[
    ["emergencia","Fondo de emergencia","s"],["ahorro","Ahorro","s"],["retiro","Retiro","s"]]},
  {id:"otros",name:"Otros",tip:"Todo lo que no cabe en las otras pestañas. Puedes agregar tus propios gastos.",items:[
    ["imprevistos","Imprevistos","w"],["donaciones","Iglesia y donaciones","w"],["bancos","Cargos bancarios","n"]]}
];
const TYPE_NAMES = {n:"Necesidad",w:"Gusto",s:"Ahorro"};

/* ---------- datos de ejemplo ---------- */
function sample(){
  return {
    example:true,
    accounts:[
      {id:uid(),name:"Cuenta corriente",type:"corriente",balance:1240},
      {id:uid(),name:"Ahorros de emergencia",type:"ahorro",balance:650}
    ],
    debts:[
      {id:uid(),name:"Visa Banco Central",type:"tarjeta",balance:3200,apr:24.99,min:96,limit:4000,dueDay:15},
      {id:uid(),name:"Tarjeta de tienda",type:"tarjeta",balance:640,apr:29.99,min:35,limit:1000,dueDay:22},
      {id:uid(),name:"Préstamo de auto",type:"auto",balance:9800,apr:7.9,min:285,limit:0,dueDay:5},
      {id:uid(),name:"Factura de hospital",type:"medica",balance:450,apr:0,min:50,limit:0,dueDay:28}
    ],
    bills:[
      {id:uid(),name:"Renta",amount:1150,dueDay:1,cat:"Vivienda"},
      {id:uid(),name:"Luz",amount:95,dueDay:12,cat:"Servicios"},
      {id:uid(),name:"Celular",amount:60,dueDay:18,cat:"Teléfono e internet"},
      {id:uid(),name:"Seguro de auto",amount:140,dueDay:20,cat:"Seguros"},
      {id:uid(),name:"Internet",amount:55,dueDay:25,cat:"Teléfono e internet"}
    ],
    paid:{},
    lowBalance:300,
    plan:{extra:150,strategy:"avalanche"},
    budget:sampleBudget(),
    credit:{onTime:94,inquiries:3,oldestYears:3,types:2,collections:1,
      history:[{d:"2026-05",s:592},{d:"2026-06",s:598},{d:"2026-07",s:604},{d:"2026-08",s:611},{d:"2026-09",s:618}],
      done:{}}
  };
}
function sampleBudget(){
  return {income:3600,custom:[],amounts:{renta:850,luz:140,agua:45,internet:70,patio:40,limpieza:25,gasolina:160,seguro_auto:45,autoexpreso:40,marbete:10,mant_auto:30,
    supermercado:450,restaurantes:120,rapida:80,cafe:25,movil:65,netflix:15.49,musica:11.99,streaming:10,ropa:80,cuidado:40,online:60,salidas:100,cine:30,
    medicinas:25,mascotas:35,emergencia:50,ahorro:50,donaciones:20}};
}
function blank(){
  return {example:false,accounts:[],debts:[],bills:[],paid:{},lowBalance:200,plan:{extra:100,strategy:"avalanche"},
    budget:{income:0,amounts:{},custom:[]},credit:{onTime:100,inquiries:0,oldestYears:1,types:1,collections:0,history:[],done:{}}};
}
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || blank(); }catch(e){ S = blank(); }
// marcar pagos de ejemplo del mes actual ya vencidos como pagados, excepto uno (para mostrar un atraso)
function seedExamplePaid(){
  if(!S.example || S._seeded) return;
  const k = ym(today); let skip = true;
  [...S.bills,...S.debts].forEach(x=>{ if(x.dueDay && x.dueDay < today.getDate()){ if(skip && x.dueDay>1){skip=false;return;} S.paid[x.id+"|"+k]=true; }});
  S._seeded = true;
}
seedExamplePaid();
// migrar presupuesto de la versión anterior (categorías) al nuevo formato por pestañas
if(!S.budget.amounts){
  const old = S.budget.cats || [];
  if(S.example) S.budget = sampleBudget();
  else { S.budget = {income:+S.budget.income||0, amounts:{}, custom:old.map(c=>({id:c.id,name:c.name,group:"otros",t:c.fixed?"n":"w"}))}; old.forEach(c=>S.budget.amounts[c.id]=+c.planned||0); }
}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
save();

/* ---------- cálculos ---------- */
const sum = (a,f) => a.reduce((t,x)=>t+(+f(x)||0),0);
const cards = () => S.debts.filter(d=>d.type==="tarjeta" && +d.limit>0);
function utilization(list = cards()){
  const lim = sum(list,d=>d.limit); return lim ? sum(list,d=>d.balance)/lim*100 : 0;
}
function payments(){ // todos los pagos mensuales con fecha
  return [
    ...S.bills.map(b=>({id:b.id,name:b.name,amount:+b.amount,dueDay:+b.dueDay,kind:"Factura"})),
    ...S.debts.filter(d=>+d.dueDay>0 && +d.balance>0).map(d=>({id:d.id,name:d.name,amount:+d.min,dueDay:+d.dueDay,kind:"Pago mínimo"}))
  ];
}
function dateFor(p, base){ // fecha del pago en el mes de 'base'
  const last = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  return new Date(base.getFullYear(), base.getMonth(), Math.min(p.dueDay,last));
}
const isPaid = (p, d) => !!S.paid[p.id+"|"+ym(d)];
function statusOf(p, date){
  if(isPaid(p,date)) return "paid";
  const days = Math.round((date - today)/864e5);
  if(days < 0) return "late";
  if(days <= 7) return "soon";
  return "later";
}
function upcoming(daysAhead=31){
  const out=[]; const thisM = new Date(today.getFullYear(),today.getMonth(),1); const nextM = new Date(today.getFullYear(),today.getMonth()+1,1);
  for(const p of payments()){
    for(const base of [thisM,nextM]){
      const d = dateFor(p,base); const days = Math.round((d-today)/864e5);
      const st = statusOf(p,d);
      if((st==="late") || (days>=0 && days<=daysAhead && st!=="paid")) out.push({...p,date:d,days,status:st});
    }
  }
  return out.sort((a,b)=>a.date-b.date);
}
function payoff(debts, extra, strategy){
  let ds = debts.filter(d=>+d.balance>0).map(d=>({name:d.name,bal:+d.balance,apr:+d.apr||0,min:Math.max(+d.min||0,1)}));
  const budget = sum(ds,d=>d.min) + (+extra||0);
  let m=0, interest=0; const done=[];
  while(ds.some(d=>d.bal>0.005) && m<600){
    m++;
    ds.forEach(d=>{ if(d.bal>0){ const i=d.bal*d.apr/1200; d.bal+=i; interest+=i; }});
    let pool = budget;
    ds.forEach(d=>{ if(d.bal>0){ const p=Math.min(d.min,d.bal); d.bal-=p; pool-=p; }});
    const order = ds.filter(d=>d.bal>0.005).sort(strategy==="snowball" ? (a,b)=>a.bal-b.bal : (a,b)=>b.apr-a.apr || a.bal-b.bal);
    for(const t of order){ if(pool<=0) break; const p=Math.min(pool,t.bal); t.bal-=p; pool-=p; }
    ds.forEach(d=>{ if(d.bal<=0.005 && !d.doneAt){ d.bal=0; d.doneAt=m; done.push({name:d.name,month:m}); }});
  }
  return {months:m, interest, done, stuck: m>=600, budget};
}
function addMonths(n){ const d=new Date(today.getFullYear(), today.getMonth()+n, 1); return MESES[d.getMonth()]+" "+d.getFullYear(); }
function fmtMonths(n){ const y=Math.floor(n/12), r=n%12; return (y? y+(y===1?" año":" años"):"") + (y&&r?" y ":"") + (r? r+(r===1?" mes":" meses"):"") || "0 meses"; }

/* puntaje estimado — orientativo, basado en los pesos públicos de FICO */
function creditFactors(utilOverride){
  const c=S.credit, u = utilOverride ?? utilization();
  const pay = c.onTime>=100?1: c.onTime>=98?.85: c.onTime>=95?.7: c.onTime>=90?.45: .2;
  const payAdj = Math.max(0, pay - (+c.collections||0)*0.12);
  const ut = cards().length===0 ? .6 : u<=9?1: u<=29?.8: u<=49?.55: u<=74?.3: .1;
  const age = Math.min(1, (+c.oldestYears||0)/10*0.9 + 0.1);
  const mix = (+c.types||0)>=3?1:(+c.types||0)===2?.8:.5;
  const inq = (+c.inquiries||0)===0?1:c.inquiries==1?.9:c.inquiries==2?.75:c.inquiries<=4?.5:.25;
  return [
    {key:"pay",name:"Historial de pagos",w:35,v:payAdj,detail:`${c.onTime}% de pagos a tiempo${c.collections?`, ${c.collections} cuenta(s) en cobranza`:""}`},
    {key:"util",name:"Uso del crédito (utilización)",w:30,v:ut,detail: cards().length?`Usas ${u.toFixed(0)}% de tu límite total en tarjetas`:"No tienes tarjetas registradas"},
    {key:"age",name:"Antigüedad del crédito",w:15,v:age,detail:`Cuenta más antigua: ${c.oldestYears} año(s)`},
    {key:"mix",name:"Tipos de crédito",w:10,v:mix,detail:`${c.types} tipo(s) de crédito (tarjeta, préstamo, hipoteca…)`},
    {key:"new",name:"Crédito nuevo y consultas",w:10,v:inq,detail:`${c.inquiries} consulta(s) dura(s) en los últimos 12 meses`}
  ];
}
function estScore(f){ const idx = sum(f,x=>x.w*x.v)/100; return Math.round(300 + 550*idx); }
function band(s){ return s>=800?["Excepcional","good"]: s>=740?["Muy bueno","good"]: s>=670?["Bueno","good"]: s>=580?["Regular","warn"]:["Bajo","bad"]; }

function alerts(){
  const a=[]; const up = upcoming(14);
  const late = up.filter(p=>p.status==="late");
  late.forEach(p=>a.push({lvl:"bad",t:`Pago atrasado: ${p.name}`,d:`Vencía el ${p.date.getDate()} de ${MESES[p.date.getMonth()]}. Págalo hoy: un atraso de 30 días o más se reporta a los burós.`,id:p.id,date:p.date}));
  up.filter(p=>p.status==="soon").forEach(p=>a.push({lvl:"warn",t:`${p.name} vence ${p.days===0?"hoy":p.days===1?"mañana":"en "+p.days+" días"}`,d:`${money(p.amount)} · ${p.kind}`,id:p.id,date:p.date}));
  const cash = sum(S.accounts.filter(x=>x.type==="corriente"),x=>x.balance);
  const due14 = sum(up.filter(p=>p.status!=="paid"),p=>p.amount);
  if(S.accounts.length && cash < due14) a.push({lvl:"bad",t:"Saldo insuficiente para los próximos 14 días",d:`Tienes ${money(cash)} en cuentas corrientes y ${money(due14)} por pagar.`});
  else if(S.accounts.length && cash - due14 < S.lowBalance) a.push({lvl:"warn",t:"Saldo bajo después de pagos",d:`Te quedarían ${money(cash-due14)} después de lo que vence en 14 días (tu alerta es ${money(S.lowBalance)}).`});
  cards().forEach(c=>{ const u=c.balance/c.limit*100; if(u>=30) a.push({lvl:u>=50?"bad":"warn",t:`${c.name} al ${u.toFixed(0)}% de su límite`,d:`Bajarla a ${money(c.limit*.29)} o menos ayuda a tu puntaje.`}); });
  return a;
}

/* --- Historial mes por mes --- */
const CAN_PRINT = (()=>{ try{ return window.self===window.top; }catch(e){ return false; } })();
const mesNombre = m => { const [y,mm]=m.split("-").map(Number); return MESES[mm-1][0].toUpperCase()+MESES[mm-1].slice(1)+" "+y; };
function snap(){
  const m=ym(today), first=new Date(today.getFullYear(),today.getMonth(),1), ps=payments();
  return {m, income:+S.budget.income||0, total:budgetTotal(), items:{...S.budget.amounts}, custom:S.budget.custom.map(c=>({...c})),
    groups:Object.fromEntries(GROUPS.map(g=>[g.id,groupTotal(g)])), debtMins:debtMins(), extra:+S.plan.extra||0,
    debt:sum(S.debts,d=>d.balance), debts:S.debts.map(({name,type,balance,apr,min,limit})=>({name,type,balance,apr,min,limit})),
    savings:savings(), cash:sum(S.accounts,a=>a.balance), score:estScore(creditFactors()),
    real:(S.credit.history.find(h=>h.d===m)||{}).s||null, util:utilization(), pays:ps.length, paid:ps.filter(p=>isPaid(p,first)).length};
}
function recordMonth(){
  S.months ||= {};
  const cur = snap(); S.months[cur.m] = cur;
  if(S.example && !S._histSeeded){ // meses anteriores de ejemplo, para que se vea el historial
    for(let i=1;i<=5;i++){
      const d=new Date(today.getFullYear(),today.getMonth()-i,1), m=ym(d), o=JSON.parse(JSON.stringify(cur));
      o.m=m; o.items.restaurantes=(o.items.restaurantes||0)+i*15; o.items.online=(o.items.online||0)+i*10;
      o.groups.comida+=i*15; o.groups.compras+=i*10; o.total+=i*25;
      o.debt=cur.debt+i*380; o.debts=o.debts.map(x=>({...x,balance:x.balance+i*95}));
      o.savings=Math.max(0,cur.savings-i*90); o.real=(S.credit.history.find(h=>h.d===m)||{}).s||null;
      o.score=cur.score-i*7; o.util=Math.min(99,cur.util+i*3); o.paid=i===3?o.pays-1:o.pays;
      S.months[m]=o;
    }
    S._histSeeded=true;
  }
  save();
}
const monthsList = () => Object.values(S.months||{}).sort((a,b)=>a.m<b.m?-1:1);
function histChart(arr){
  if(arr.length<2) return `<p class="small muted">El historial se llena solo: cada mes que uses la app se guarda una foto de tus números.</p>`;
  const W=640,H=200,L=58,R=14,T=12,B=28; const mx=Math.max(...arr.flatMap(a=>[a.debt,a.savings]),1);
  const step=Math.pow(10,Math.floor(Math.log10(mx))), top=Math.ceil(mx/step)*step;
  const X=i=>L+(W-L-R)*i/(arr.length-1), Y=v=>T+(H-T-B)*(1-v/top);
  const line=k=>arr.map((a,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(a[k]).toFixed(1)}`).join(" ");
  const short=v=>v>=1e3?"$"+(v/1e3).toFixed(v>=1e4?0:1)+"k":"$"+Math.round(v);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto;display:block" role="img" aria-label="Deuda y ahorros por mes">
    ${[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${Y(top*f)}" y2="${Y(top*f)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(top*f)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${short(top*f)}</text>`).join("")}
    ${arr.map((a,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MESES[+a.m.slice(5)-1].slice(0,3)}</text>`).join("")}
    <path d="${line("debt")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <path d="${line("savings")}" fill="none" stroke="var(--mustard)" stroke-width="2.5"/>
    ${arr.map((a,i)=>`<circle cx="${X(i)}" cy="${Y(a.debt)}" r="3.5" fill="var(--accent)"/><circle cx="${X(i)}" cy="${Y(a.savings)}" r="3.5" fill="var(--mustard)"/>`).join("")}
  </svg></div>
  <div class="legend"><span class="lg"><i style="background:var(--accent)"></i>Deuda total</span><span class="lg"><i style="background:var(--mustard)"></i>Ahorros</span></div>`;
}
function delta(v, prev, goodWhenDown){
  if(prev===undefined||prev===null) return "";
  const d=v-prev; if(Math.abs(d)<1) return "";
  const good = goodWhenDown ? d<0 : d>0;
  return ` <span class="dl ${good?"up":"down"}">${d>0?"▲":"▼"}${money(Math.abs(d))}</span>`;
}
function historyCard(){

      <tbody>${rows.map((a,i)=>{ const p=rows[i+1]; const left=a.income-a.total;
        return `<tr${a.m===ym(today)?' class="cur"':""}><th scope="row">${mesNombre(a.m)}${a.m===ym(today)?' <span class="pill neutral">En curso</span>':""}</th>

        <td style="color:${left<0?"var(--bad)":"inherit"}">${money(left)}</td>
        <td>${money(a.debt)}${delta(a.debt,p?.debt,true)}</td><td>${money(a.savings)}${delta(a.savings,p?.savings,false)}</td>

    </table></div>
    <p class="small muted">Se guarda una foto de tus números cada mes que abres la app. “~” es el crédito estimado; si anotas tu puntaje real, se muestra ese.</p>
    
  </div>`;
}
function report(mk){
  const all = mk==="all";
  const a = all || mk===ym(today) ? snap() : S.months[mk];

function growCalc(start, monthly, years, rate){
  let bal=+start||0, put=+start||0; const pts=[{y:0,bal,put}];
  for(let m=1;m<=years*12;m++){ bal = bal*(1+rate/1200) + monthly; put += monthly; if(m%12===0) pts.push({y:m/12,bal,put}); }
  return pts;
}
function growChart(pts){

  const X=y=>L+(W-L-R)*y/(pts.at(-1).y||1), Y=v=>T+(H-T-B)*(1-v/top);
  const path=k=>pts.map((p,i)=>`${i?"L":"M"}${X(p.y).toFixed(1)} ${Y(p[k]).toFixed(1)}`).join(" ");
  const ticks=[0,.25,.5,.75,1].map(f=>top*f);
  const every=Math.ceil(pts.length/8);
  const xt = pts.filter((p,i)=>i%every===0 || i===pts.length-1);
  const short=v=>v>=1e6?"$"+(v/1e6).toFixed(1)+"M":v>=1e3?"$"+Math.round(v/1e3)+"k":"$"+Math.round(v);
  const last=pts.at(-1);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto;display:block" role="img" aria-label="Crecimiento de tu dinero">

    ${xt.map(p=>`<text x="${X(p.y)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${p.y}a</text>`).join("")}
    <path d="${path("bal")} L${X(last.y)} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="var(--accent-soft)"/>
    <path d="${path("bal")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>

function creditSteps(){
  const c=S.credit, steps=[], u=utilization();
  const late = upcoming(14).filter(p=>p.status==="late");
  if(late.length) steps.push({k:"late",t:`Paga hoy ${late.map(p=>p.name).join(", ")} para evitar un reporte de atraso.`,d:"Los atrasos se reportan a los burós cuando llegan a 30 días. Si ya pasó, llama y pide una “carta de buena voluntad” para que lo quiten."});
  steps.push({k:"autopay",t:"Activa el pago automático del mínimo en todas tus cuentas.",d:"El historial de pagos es el 35% del puntaje. El autopago evita olvidos; luego pagas el resto manualmente."});
  if(u>=10){ const lim=sum(cards(),d=>d.limit), target=lim*.09, need=sum(cards(),d=>d.balance)-target;
    steps.push({k:"util",t:`Baja el uso de tus tarjetas de ${u.toFixed(0)}% a menos de 10% (pagar ${money(Math.max(need,0))}).`,d:"Paga antes de la fecha de cierre del estado de cuenta, no solo antes del vencimiento. El saldo del cierre es el que se reporta."}); }
  if(c.collections>0) steps.push({k:"coll",t:`Revisa tu${c.collections>1?"s":""} ${c.collections} cuenta(s) en cobranza.`,d:"Pide validación de la deuda por escrito. Las deudas médicas pagadas ya no aparecen en tu reporte, y las menores de $500 tampoco se reportan."});
  steps.push({k:"report",t:"Revisa tus 3 reportes de crédito gratis y disputa errores.",d:"En AnnualCreditReport.com (el sitio oficial) puedes verlos gratis cada semana. Disputa cuentas que no son tuyas, pagos marcados tarde por error o saldos equivocados."});
  if(c.inquiries>=2) steps.push({k:"inq",t:"No solicites crédito nuevo por 6–12 meses.",d:"Cada solicitud genera una consulta dura. Pesan menos con el tiempo y desaparecen a los 2 años."});
  if(c.oldestYears<5) steps.push({k:"old",t:"No cierres tus tarjetas más antiguas.",d:"Cerrarlas reduce tu límite total y la antigüedad promedio. Úsalas para una compra pequeña cada pocos meses."});
  if(cards().length===0) steps.push({k:"secured",t:"Abre una tarjeta asegurada para empezar a construir historial.",d:"Depositas una garantía (desde $200) que se vuelve tu límite. Elige una que reporte a los 3 burós."});
  if(c.types<2) steps.push({k:"builder",t:"Considera un préstamo constructor de crédito (credit builder).",d:"Lo ofrecen muchas cooperativas. Pagas cuotas pequeñas a una cuenta de ahorro y se reporta como préstamo a plazos."});
  steps.push({k:"rent",t:"Haz que tu renta y servicios cuenten.",d:"Algunos servicios reportan tus pagos de renta, y Experian Boost puede agregar luz, teléfono y streaming a tu reporte."});
  steps.push({k:"auth",t:"Pide ser usuario autorizado de alguien con buen historial.",d:"Solo si esa persona paga a tiempo y usa poco su tarjeta. Su historial positivo puede sumar al tuyo."});
  return steps;
}
function gauge(score, lo, hi){
  const ang = s => Math.PI*(1-(s-300)/550);
  const pt = (s,r) => [150+r*Math.cos(ang(s)), 150-r*Math.sin(ang(s))];
  const arc = (a,b,r) => { const [x1,y1]=pt(a,r),[x2,y2]=pt(b,r); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const segs=[[300,579,"var(--bad)"],[580,669,"var(--warn)"],[670,739,"var(--good)"],[740,850,"var(--accent)"]];
  const [nx,ny]=pt(score,104);
  return `<svg viewBox="0 0 300 175" role="img" aria-label="Puntaje estimado ${score} de 850">
    ${segs.map(([a,b,c])=>`<path d="${arc(a+1,b-1,118)}" stroke="${c}" stroke-width="14" fill="none" stroke-linecap="butt" opacity=".9"/>`).join("")}
    <path d="${arc(Math.max(300,lo),Math.min(850,hi),134)}" stroke="var(--fg)" stroke-width="4" fill="none" stroke-linecap="round" opacity=".5"/>
    <line x1="150" y1="150" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="150" r="7" fill="var(--fg)"/>
    <text x="22" y="170" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">300</text>
    <text x="256" y="170" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">850</text>
  </svg>`;
}
function spark(h){
  if(h.length<2) return `<p class="small muted">Anota tu puntaje cada mes para ver tu progreso.</p>`;
  const W=600,H=120,pad=28; const vals=h.map(x=>+x.s); let mn=Math.min(...vals), mx=Math.max(...vals); if(mx-mn<20){mn-=10;mx+=10;}
  const X=i=>pad+i*(W-pad*2)/(h.length-1), Y=v=>H-20-(v-mn)/(mx-mn)*(H-40);
  const line=h.map((x,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(x.s).toFixed(1)}`).join(" ");
  const last=h[h.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Historial de puntaje">
    <line x1="${pad}" x2="${W-pad}" y1="${Y(mn).toFixed(1)}" y2="${Y(mn).toFixed(1)}" stroke="var(--line)"/>
    <line x1="${pad}" x2="${W-pad}" y1="${Y(mx).toFixed(1)}" y2="${Y(mx).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <path d="${line} L${X(h.length-1).toFixed(1)} ${H-20} L${pad} ${H-20} Z" fill="var(--accent-soft)" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(h.length-1).toFixed(1)}" cy="${Y(last.s).toFixed(1)}" r="5" fill="var(--accent)"/>
  </svg>
  <div style="display:flex;justify-content:space-between" class="small muted num"><span>${esc(h[0].d)} · ${h[0].s}</span><span>${esc(last.d)} · <strong style="color:var(--fg)">${last.s}</strong> (${last.s-h[0].s>=0?"+":""}${last.s-h[0].s})</span></div>`;
}

  const cols=["--accent","--mustard","--navy-2","--c5"].map(v=>cs.getPropertyValue(v).trim()).concat(["#FFFFFF","#FFD95A"]);
  const P=Array.from({length:160},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let t=0; (function f(){ ctx.clearRect(0,0,W,H); t++;
    P.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(t<150) requestAnimationFrame(f); else ctx.clearRect(0,0,W,H); })();
}
function win(key, title, msg){ // logro único: se guarda y se celebra en grande una sola vez
  S.wins ||= []; if(key && S.wins.some(w=>w.k===key)) return false;
  S.wins.unshift({k:key||uid(),t:title,m:msg,d:new Date().toISOString().slice(0,10)}); save();

function checkMilestones(before){
  const debt=sum(S.debts,d=>d.balance), u=utilization();
  if(before.debt>0 && debt<before.debt){
    const paidOff=S.debts.filter(d=>+d.balance<=0 && before.balances[d.id]>0);
    paidOff.forEach(d=>win("paidoff-"+d.id,`¡${d.name} liquidada!`,`Una deuda menos para siempre. Ese pago de ${money(d.min)} ahora va directo a la siguiente.`));
    if(!paidOff.length) toast(cheer(),`Bajaste tu deuda ${money(before.debt-debt)}. Te quedan ${money(debt)}.`,false,"↓");
    const start=S.startDebt||before.debt; S.startDebt ||= start;
    [25,50,75].forEach(p=>{ if((start-debt)/start*100>=p) win("debt"+p,`¡Ya pagaste el ${p}% de tus deudas!`,p===50?"Vas a la mitad del camino. Lo más difícil ya pasó.":p===75?"La meta está muy cerca. ¡No pares ahora!":"El primer cuarto es el más duro y ya lo lograste."); });
    if(debt<=0) win("debtfree","¡ERES LIBRE DE DEUDAS!","Lo lograste. Ahora ese dinero es tuyo: ahorro, inversión y tranquilidad.");
  }
  const sv=savings();
  if(sv>before.sav){
    if(before.sav<500 && sv>=500) win("emerg500","¡Tus primeros $500 de emergencia!","Ya tienes un colchón para los imprevistos pequeños. ¡Sigue!");
    if(before.sav<1000 && sv>=1000) win("emerg1000","¡$1,000 de fondo de emergencia!","Completaste el primer escalón. Un imprevisto ya no te obliga a usar la tarjeta.");
    const n=byType().n; if(n>0 && before.sav<n*3 && sv>=n*3) win("emerg3m","¡3 meses de gastos ahorrados!","Tienes un fondo de emergencia completo. Muy pocas personas lo logran.");
    if(!(before.sav<1000&&sv>=1000) && !(before.sav<500&&sv>=500)) toast(cheer(),`Tus ahorros subieron ${money(sv-before.sav)}. Ya tienes ${money(sv)}.`,false,"↑");
  }
  if(cards().length){
    if(before.util>=30 && u<30) win("util30","¡Tus tarjetas bajaron del 30%!","Los burós lo notarán en tu próximo reporte. Tu puntaje debería subir.");
    if(before.util>=10 && u<10) win("util10","¡Uso menor al 10%!","Este es el nivel de las personas con crédito excelente. ¡Felicidades!");
  }
  save();
}

function onPaid(id, ymk){

// El PIN se guarda solo como huella (hash con sal) en este teléfono; nunca en texto.
const PIN_KEY = KEY+"-pin";
const getPin = () => { try{ return JSON.parse(localStorage.getItem(PIN_KEY)); }catch(e){ return null; } };
async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt+":"+pin);
  if(window.crypto?.subtle){ const h=await crypto.subtle.digest("SHA-256",data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  let h=5381; for(const b of data) h=((h<<5)+h+b)|0; return "d"+h;
}
const P = {mode:null, buf:"", first:"", err:"", fails:0, waitUntil:0, confirmWipe:false};
const PIN_TEXT = {
  unlock:["Ingresa tu PIN","Tu información está protegida."],
  create:["Crea tu PIN","Escoge 4 números fáciles de recordar para ti y difíciles de adivinar."],
  confirm:["Confirma tu PIN","Escribe los mismos 4 números otra vez."],
  change:["PIN actual","Primero escribe tu PIN de ahora."],
  remove:["Quitar el PIN","Escribe tu PIN para confirmar."]
};
function pinOpen(mode){ P.mode=mode; P.buf=""; P.err=""; P.confirmWipe=false; if(mode==="unlock"){ locked=true; $("#app").innerHTML=""; } drawPin(); }
function pinClose(){ $("#lock").hidden=true; $("#lock").innerHTML=""; P.mode=null; }
function drawPin(){
  const v=$("#lock"); v.hidden=false;
  if(P.mode==="forgot"){
    v.innerHTML=`<div class="lock-box">${$(".brand .logo").outerHTML}<h2>¿Olvidaste tu PIN?</h2>
      <p class="lock-sub">Por tu seguridad, el PIN no se puede recuperar. Para entrar de nuevo hay que <strong>borrar toda la información guardada en este teléfono</strong> y empezar desde cero. Esto no se puede deshacer.</p>
      <div class="lock-actions"><button class="btn danger-solid" data-pin-act="wipe">${P.confirmWipe?"Sí, borrar todo":"Borrar mis datos y empezar de nuevo"}</button><button class="btn" data-pin-act="back">Volver a intentar</button></div></div>`;
    return;
  }
  const [title,sub]=PIN_TEXT[P.mode]; const wait=Date.now()<P.waitUntil;
  v.innerHTML=`<div class="lock-box">${$(".brand .logo").outerHTML}<h2>${title}</h2><p class="lock-sub">${sub}</p>
    <div class="pin-dots${P.err?" shake":""}" aria-label="${P.buf.length} de 4 números">${[0,1,2,3].map(i=>`<i class="${i<P.buf.length?"on":""}"></i>`).join("")}</div>
    <p class="pin-err" role="alert" ${P.err?"":"hidden"}>${esc(P.err)}</p>
    <div class="keypad"${wait?' aria-disabled="true"':""}>${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin="${n}" ${wait?"disabled":""}>${n}</button>`).join("")}
      ${P.mode==="unlock"?`<span></span>`:`<button class="kp-txt" data-pin-act="cancel">Cancelar</button>`}<button data-pin="0" ${wait?"disabled":""}>0</button><button class="kp-txt" data-pin-act="del" aria-label="Borrar un número">⌫</button></div>
    ${P.mode==="unlock"?`<button class="linkbtn" data-pin-act="forgot">Olvidé mi PIN</button>`:""}
    <p class="lock-sign">Al Día · Biz Ascend Web Creators</p></div>`;
}
async function pinSubmit(){
  const pin=P.buf, saved=getPin(); P.buf=""; P.err="";
  const ok = async () => saved && (await hashPin(pin,saved.salt))===saved.hash;
  if(P.mode==="unlock"){
    if(await ok()){ P.fails=0; locked=false; pinClose(); render(); return; }
    P.fails++; P.err = P.fails>=5 ? "Demasiados intentos. Espera 30 segundos." : "PIN incorrecto. Inténtalo otra vez.";
    if(P.fails>=5){ P.waitUntil=Date.now()+30000; P.fails=0; setTimeout(()=>{ if(P.mode==="unlock"){ P.err=""; drawPin(); } },30000); }
  } else if(P.mode==="create"){ P.first=pin; P.mode="confirm"; }
  else if(P.mode==="confirm"){
    if(pin!==P.first){ P.mode="create"; P.err="Los PIN no coinciden. Vuelve a crearlo."; }
    else { const salt=uid()+uid(); const hash=await hashPin(pin,salt); try{ localStorage.setItem(PIN_KEY,JSON.stringify({salt,hash})); }catch(e){}
      pinClose(); render(); win("pin","¡Tu información está protegida!","Desde ahora, solo quien sepa tu PIN puede entrar a tu app."); return; }
  } else if(P.mode==="change"){ if(await ok()) P.mode="create"; else P.err="Ese no es tu PIN actual."; }
  else if(P.mode==="remove"){ if(await ok()){ try{ localStorage.removeItem(PIN_KEY); }catch(e){} pinClose(); render(); toast("PIN quitado","La app ya no pedirá PIN al abrirla.",false,"✓"); return; } P.err="PIN incorrecto."; }
  drawPin();
}
function pinKey(d){ if(Date.now()<P.waitUntil || P.buf.length>=4) return; P.buf+=d; P.err=""; drawPin(); if(P.buf.length===4) setTimeout(pinSubmit,120); }
$("#lock").addEventListener("click", e=>{
  const b=e.target.closest("[data-pin],[data-pin-act]"); if(!b) return;
  if(b.dataset.pin) return pinKey(b.dataset.pin);

  else if(a==="back"){ P.mode="unlock"; P.buf=""; P.err=""; drawPin(); }
  else if(a==="wipe"){
    if(!P.confirmWipe){ P.confirmWipe=true; return drawPin(); }
    try{ localStorage.removeItem(PIN_KEY); localStorage.removeItem(KEY); }catch(e){}
    S=blank(); save(); locked=false; pinClose(); go("presupuesto"); toast("Empezaste de nuevo","Crea un PIN nuevo desde la pestaña Resumen.",false,"✓");
  }
});

  else if(a==="pin-lock"){ pinOpen("unlock"); }
  else if(a==="pin-nudge-off"){ S.pinNudgeOff=true; save(); render(); }
  else if(a==="rep-close"){ $("#repview").hidden=true; }
  else if(a==="rep-copy"){ const txt=$("#rep-paper").innerText;
    const done=()=>toast("Reporte copiado","Pégalo en Notas, WhatsApp o un correo para guardarlo.",false,"✓");
    try{ navigator.clipboard.writeText(txt).then(done,()=>{ selectPaper(); toast("Selecciona y copia","El texto del reporte quedó seleccionado. Toca Copiar.",false,"!"); }); }catch(e){ selectPaper(); } }
  else if(a==="strat"){ S.plan.strategy=t.dataset.v; save(); render(); }
  else if(a==="apply-sim"){ const add=Math.round(wantsTotal()*simCut/100)+simPay; S.plan.extra=(+S.plan.extra||0)+add; simCut=0; simPay=0; save(); render(); toast("¡Decisión poderosa!",`Ahora pones ${money(add)} más al mes a tus deudas. Mira tu plan en la pestaña Crédito.`,true,"↑"); }
  else if(a==="load-example"){ S=sample(); S._seeded=false; seedExamplePaid(); save(); go("presupuesto"); }
  else if(a==="start-fresh"){
    if(t.dataset.confirm!=="1"){ t.dataset.confirm="1"; t.textContent="Sí, borrar el ejemplo"; return; }
    S=blank(); save(); go("presupuesto");
  }
});
function setPath(path,val){ const ks=path.split("."); let o=S; ks.slice(0,-1).forEach(k=>o=o[k]); o[ks.at(-1)]=val; }
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.dataset.set){ setPath(el.dataset.set, +el.value||0); save();
    if(el.id==="extra"){ const o=$("#extra-out"); if(o) o.textContent=money(+el.value); } }
  if(el.dataset.amt){ const v=+el.value||0; if(v) S.budget.amounts[el.dataset.amt]=v; else delete S.budget.amounts[el.dataset.amt]; save(); liveBudget(); el.closest(".amt-row")?.classList.toggle("filled",v>0); }
  if(el.dataset.grow){ S.grow ||= {}; S.grow[el.dataset.grow]=+el.value||0; save(); }
  if(el.dataset.sim){ if(el.dataset.sim==="cut") simCut=+el.value; else if(el.dataset.sim==="pay") simPay=+el.value; else simPay2=+el.value; }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset.step){ S.credit.done[el.dataset.step]=el.checked; save();
    if(el.checked){ const st=creditSteps(), n=st.filter(s=>S.credit.done[s.k]).length;
      if(n===st.length) win("allsteps","¡Completaste tu plan de crédito!","Hiciste todo lo que está en tus manos. Ahora el tiempo y la constancia trabajan a tu favor.");
      else toast(cheer(),`Paso ${n} de ${st.length} completado. Cada hábito suma puntos.`,false,"✓"); } }
  if(el.dataset.set==="budget.income"||el.dataset.amt) budgetWins();
  if(el.dataset.set||el.dataset.amt||el.dataset.sim||el.dataset.step||el.dataset.grow){
    // re-dibujar después de que el foco pase al siguiente campo, y devolverlo allí
    setTimeout(()=>{ const a=document.activeElement, id=a&&a.id, y=scrollY; render(); scrollTo(0,y); const n=id&&document.getElementById(id); if(n&&n.type!=="checkbox") n.focus({preventScroll:true}); },0); }
});
boot();
})();
</script>

if("serviceWorker" in navigator){ addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
